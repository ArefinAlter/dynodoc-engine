version: "3"
dotenv: [".env"]
tasks:
  setup:
    desc: Create local .env and .env.migrate with generated dev keys (preserves existing files)
    cmds:
      - cmd: bash scripts/dev-setup.sh
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/dev-setup.ps1
        platforms: [windows]
  up:
    desc: Start local PostgreSQL on loopback port 5548
    cmds: ["docker compose up -d --wait"]
  down:
    desc: Stop local PostgreSQL container (preserves data volume)
    cmds: ["docker compose down"]
  db:bootstrap-runtime:
    desc: Create or sync the restricted dynodoc_runtime login in local Compose PostgreSQL
    cmds:
      - cmd: bash scripts/dev-bootstrap-runtime.sh
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/dev-bootstrap-runtime.ps1
        platforms: [windows]
  dev:init:
    desc: First-time local setup (env files, Postgres, runtime role, migrations, grants, check)
    cmds:
      - task: setup
      - task: up
      - task: db:bootstrap-runtime
      - task: migrate
      - task: db:grant-runtime
      - task: db:check
  db:upgrade:
    desc: Apply new migrations, refresh runtime grants, and verify privileges (run after git pull)
    cmds:
      - task: migrate
      - task: db:grant-runtime
      - task: db:check
  run:
    desc: Run the provisioned API; never applies migrations
    cmds:
      - cmd: bash scripts/dev-run.sh
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/dev-run.ps1
        platforms: [windows]
  migrate:
    desc: Apply migrations in a separate operator process
    dotenv: [".env.migrate"]
    cmds: ["cargo run --locked -p engine-admin -- migrate"]
  db:grant-runtime:
    desc: Grant the explicit allowlist to an existing dynodoc_runtime login
    dotenv: [".env.migrate"]
    cmds: ["cargo run --locked -p engine-admin -- grant-runtime dynodoc_runtime"]
  db:check:
    desc: Read-only schema/runtime privilege check
    dotenv: [".env"]
    cmds: ["cargo run --locked -p engine-admin -- check-runtime"]
  doctor:
    desc: Check local prerequisites, env files, and runtime database privileges
    cmds:
      - cmd: |
          echo "Rust:   $(rustc --version 2>/dev/null || echo 'MISSING')"
          echo "Docker: $(docker --version 2>/dev/null || echo 'MISSING')"
          test -f .env && echo ".env:         present" || echo ".env:         MISSING (run: task setup)"
          test -f .env.migrate && echo ".env.migrate: present" || echo ".env.migrate: MISSING (run: task setup)"
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/dev-doctor.ps1
        platforms: [windows]
      - task: db:check
  test:
    desc: Run pure and isolated PostgreSQL integration tests (requires owner DATABASE_URL in env)
    cmds: ["cargo test --locked --workspace -- --test-threads=1"]
  test:local:
    desc: Run full workspace tests against the local Compose PostgreSQL owner on 127.0.0.1:5548
    env:
      DATABASE_URL: postgres://dynodoc:local-development-only@127.0.0.1:5548/dynodoc_engine
    cmds: ["cargo test --locked --workspace -- --test-threads=1"]
  test:unit:
    desc: Run pure-Rust and operator parser unit tests without needing PostgreSQL or Docker
    cmds:
      - cargo test --locked -p engine-shared -p engine-agent -p engine-mcp -p dynodoc-engine-wasm
      - cargo test --locked -p engine-admin --bin engine-admin
  lint:
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --locked --workspace --all-targets -- -D warnings
  docs:
    cmds: ["RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps"]
  bench:
    desc: In-memory synthetic benchmarks; database ones need a disposable database (see each example's header)
    cmds:
      - cargo run --release --locked -p engine-core --example merge_bench
      - cargo run --release --locked -p engine-core --example richtext_bench
      - cargo run --release --locked -p engine-core --example similarity_bench
  openapi:
    cmds: ["cargo run --locked -p engine-admin -- openapi --out openapi.yaml"]
  admin:
    desc: "Run engine-admin directly (usage: task admin -- <args>)"
    cmds: ["cargo run --locked -p engine-admin -- {{.CLI_ARGS}}"]
