version: "3"
dotenv: [".env"]
tasks:
  up:
    desc: Start local PostgreSQL on loopback port 5548
    cmds: ["docker compose up -d --wait"]
  run:
    desc: Run the provisioned API; never applies migrations
    cmds: ["cargo run --locked -p engine-api"]
  migrate:
    desc: Apply migrations in a separate operator process
    dotenv: [".env.migrate"]
    cmds: ["cargo run --locked -p engine-cli -- migrate"]
  db:grant-runtime:
    desc: Grant the explicit allowlist to an existing dynodoc_runtime login
    dotenv: [".env.migrate"]
    cmds: ["cargo run --locked -p engine-cli -- grant-runtime dynodoc_runtime"]
  db:check:
    desc: Read-only schema/runtime privilege check
    cmds: ["cargo run --locked -p engine-cli -- check-runtime"]
  test:
    desc: Run pure and isolated PostgreSQL integration tests
    cmds: ["cargo test --locked --workspace -- --test-threads=1"]
  lint:
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --locked --workspace --all-targets -- -D warnings
  docs:
    cmds: ["cargo doc --locked --workspace --no-deps"]
  bench:
    desc: In-memory synthetic benchmarks; database ones need a disposable database (see each example's header)
    cmds:
      - cargo run --release --locked -p engine-core --example merge_bench
      - cargo run --release --locked -p engine-core --example richtext_bench
      - cargo run --release --locked -p engine-core --example similarity_bench
  openapi:
    cmds: ["cargo run --locked -p engine-cli -- openapi --out openapi.yaml"]
