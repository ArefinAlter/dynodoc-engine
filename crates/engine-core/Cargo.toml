[package]
name = "engine-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "dynodoc engine core: event log, hash chain, materialization, merge."

[features]
# Deterministic nonces are unsafe outside repeatable test fixtures.
test-support = []

[dependencies]
engine-shared = { workspace = true }
sqlx = { workspace = true, features = ["sqlite"] }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
similar = "=3.2.0"
# Per-object compression at rest in the local SQLite repository (raw DEFLATE).
# Pure Rust, MIT OR Zlib OR Apache-2.0, already in the build graph through flate2.
miniz_oxide = "0.8"

[dev-dependencies]
# Integration tests build the library without cfg(test); explicitly opt in there.
engine-core = { path = ".", features = ["test-support"] }
proptest = { workspace = true }
tokio-test = { workspace = true }
insta = { workspace = true }
