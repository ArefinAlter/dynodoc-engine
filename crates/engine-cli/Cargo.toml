[package]
name = "engine-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "dynodoc admin CLI (migrate, snapshot, verify, replay)."

[[bin]]
name = "engine-cli"
path = "src/main.rs"

[dependencies]
engine-api = { workspace = true }
engine-core = { workspace = true, features = ["kms"] }
engine-shared = { workspace = true }
engine-mcp = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
ring = { workspace = true }
cryptoki = { workspace = true }
argon2 = { workspace = true }
utoipa = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
# `blocking` for the Vault Transit key provider (the KeyProvider trait is synchronous).
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# DPAPI (CryptProtectData) for `device ... --keystore`, the no-echo passphrase prompt and
# the confirmation dialog of `mcp --write` (MessageBoxW). Windows only; MIT OR Apache-2.0;
# already part of the build graph (tokio).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
axum = { workspace = true }
