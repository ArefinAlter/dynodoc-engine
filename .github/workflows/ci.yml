name: engine-ci

on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dynodoc
          POSTGRES_PASSWORD: dynodoc
          POSTGRES_DB: dynodoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dynodoc -d dynodoc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dynodoc:dynodoc@127.0.0.1:5432/dynodoc
      # Tests create/drop databases. Keep this work from competing with the
      # existing 100 ms SSE acceptance check; this is not a load benchmark.
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --workspace
      - name: Test
        run: cargo test --locked --workspace
      - name: Documentation
        run: cargo doc --locked --workspace --no-deps
      - name: OpenAPI consistency
        run: cargo run --locked -p engine-cli -- openapi --out /tmp/openapi.yaml && diff -u openapi.yaml /tmp/openapi.yaml
